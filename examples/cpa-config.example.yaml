# CLIProxyAPI (CPA) config.yaml 可选片段；其余保持原有配置。
# 当前已验证的是 Magpie 路由，不是此 CPA 示例；配置后需验证实际模型 ID 和 Messages 请求。
# GPT-6.1 Sol / GPT-6 Astra：在 CPA 中完成 Codex OAuth 登录，检查 /v1/models。
# GLM：保留智谱 Coding Plan 的 Anthropic 兼容上游。

claude-api-key:
  - api-key: "<YOUR_ZHIPU_CODING_PLAN_KEY>"
    base-url: "https://open.bigmodel.cn/api/anthropic"   # 国际版：https://api.z.ai/api/anthropic
    models:
      - name: "glm-5.3"
        alias: "glm-5.3"
      - name: "glm-5.3-flash"
        alias: "glm-5.3-flash"

  # 可选 OpenCode Go：使用 Go key，不自动启用 Zen balance 额外付费。
  # Anthropic Messages 最终 endpoint 应为 https://opencode.ai/zen/go/v1/messages，避免重复 /v1。
  - api-key: "<YOUR_OPENCODE_GO_KEY>"
    base-url: "https://opencode.ai/zen/go"
    models:
      - name: "claude-haiku-5-5"
        alias: "opencode-go/claude-haiku-5-5"

# 本机 agent 写 opencode-go/claude-haiku-5-5:medium[1m]：
# :medium 是已验证的 Magpie 路由约定；[1m] 是 Claude Code 窗口标记，由客户端剥离。
# CPA 的版本/路由配置可能不同，不保证支持冒号或同样的 effort suffix。
# CPA 旧 GPT 格式使用 (high)，当前 Magpie 使用 codex/...:high；不可直接混用。
# 安装/迁移前检查 /v1/models，并显式验证实际 suffix、路由和工具往返；不能据示例认定已接通。
