# CLIProxyAPI (CPA) config.yaml 片段 —— 只列出与本方案相关的部分，其余保持你原有配置。
# GPT-6 Astra / Sol：在 CPA 中用 ChatGPT 账号完成 Codex OAuth 登录即可，模型会自动出现在 /v1/models。
# GLM：把智谱 Coding Plan 的 Anthropic 兼容接口加成 Claude 类型上游。

claude-api-key:
  - api-key: "<YOUR_ZHIPU_CODING_PLAN_KEY>"
    base-url: "https://open.bigmodel.cn/api/anthropic"   # 国际版：https://api.z.ai/api/anthropic
    models:
      - name: "glm-5.3"
        alias: "glm-5.3"
      - name: "glm-5.3-flash"
        alias: "glm-5.3-flash"
